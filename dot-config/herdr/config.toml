onboarding = false

# Keybindings mirrored from Omarchy's config/herdr/config.toml so the muscle
# memory carries over between Omarchy and macOS.
# Upstream: https://github.com/basecamp/omarchy/blob/master/config/herdr/config.toml
# Theme/[ui] settings from upstream are deliberately not copied here.

[terminal]
# New panes, tabs, and workspaces inherit the source working directory.
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = "prefix+h"  # ponytail: no alt+enter alias — collides with Alacritty Shift+Enter (ESC+CR) for multiline agent input
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Resize the focused pane without entering resize mode (herdr 0.8.2+)
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# herdr's default prefix+shift+p is taken by previous_workspace below
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["prefix+1..9", "alt+1..9"]
previous_tab = ["prefix+p", "alt+left"]
next_tab = ["prefix+n", "alt+right"]

# Reorder the active tab in place, wrapping at either end (herdr 0.8.2+)
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

[theme]
# "terminal" follows the host terminal's ANSI palette instead of pinning a
# built-in theme, so the UI reads as native against Nightfly on macOS and
# against whichever Omarchy theme is live on Arch.
name = "terminal"

[ui]
# Glyph Rail: one Nerd Font glyph per status module, joined by a single
# Powerline soft divider. Codepoints, because these are tofu without a Nerd
# Font:  U+EC82 Claude,  U+EC81 OpenAI, ↻ U+21BB reset,
# 󰓅 U+F04C5 spend, 󰥔 U+F0954 clock, U+E0B3 divider. Host class glyphs
# live in host-label.sh.
#
# Every module carries a glyph, so no bare-text entry (`zoom`) belongs here;
# the per-tab Z marker already shows zoom state independently.
tab_bar_right = [
  { type = "command", command = "~/.config/herdr/claude-usage.sh", interval_seconds = 60, timeout_seconds = 5 },
  { type = "command", command = "~/.config/herdr/codex-usage.py", interval_seconds = 60, timeout_seconds = 5 },
  # OpenRouter's analytics API is a network source, not a local database.
  { type = "command", command = "~/.config/herdr/openrouter-spend.py", interval_seconds = 60, timeout_seconds = 5 },
  { type = "command", command = "~/.config/herdr/host-label.sh", interval_seconds = 3600, timeout_seconds = 2 },
  { type = "datetime", format = "󰥔 %H:%M" },
]
# Spelled as a TOML \u escape on purpose: U+E0B3 sits in the BMP Private Use
# Area, which text pipelines strip far more readily than the Plane-15 Nerd Font
# glyphs above. It vanished once already. tests/test-herdr-glyph-rail.py guards it.
tab_bar_right_separator = " \ue0b3 "
agent_panel_sort = "spaces"
