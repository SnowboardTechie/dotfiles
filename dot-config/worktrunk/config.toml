# Worktrunk user configuration
# Stowed to ~/.config/worktrunk/config.toml

# Sibling directory layout (worktrunk default)
# e.g., ~/code/HHS/simpler-grants-protocol.feat-auth
# No worktree-path override needed — default is sibling

# LLM commit messages via opencode
# Worktrunk pipes a templated prompt to this command via stdin
[commit.generation]
command = "~/.config/worktrunk/commit-msg.sh"

# List defaults
[list]
summary = true     # LLM branch summaries in wt list --full

# Global hooks (run for all repos, no approval needed).
# Pipeline form (array-of-tables) runs steps serially; the older single-table
# form is being repurposed to run concurrently, so pre-start uses [[...]].
[[pre-start]]
copy-ignored = "wt step copy-ignored"

[[pre-start]]
direnv = "[ -f .envrc ] && direnv allow"

# Link agent context instead of letting copy-ignored snapshot it.
# copy-ignored duplicates the trunk's untracked AGENTS.md into each new
# worktree, so every worktree froze a copy that silently went stale (and
# absolute links broke outright when a repo moved). A symlink to the trunk
# stays current for free. Runs after copy-ignored, replacing what it copied.
[[pre-start]]
link-agent-context = 't=$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)"); if [ "$PWD" != "$t" ] && [ -f "$t/AGENTS.md" ]; then ln -sfn "$t/AGENTS.md" AGENTS.md; [ -e CLAUDE.md ] || ln -sfn AGENTS.md CLAUDE.md; fi; true'
